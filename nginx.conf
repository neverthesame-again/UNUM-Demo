server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Chatbot widget files are not content-hashed (fixed filenames), so they
    # must always be revalidated instead of using the long-lived immutable
    # cache below — otherwise updates never reach users with a cached copy.
    location ^~ /chatbot/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html is the SPA entry point and is never content-hashed, but it
    # references content-hashed asset filenames that change every deploy.
    # It must never be cached (not even heuristically) or returning users
    # keep loading a stale shell that points at bundles deleted by the next
    # deploy — hence "old version until hard refresh".
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache static assets (content-hashed by Vite, safe to cache forever)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy automation pipeline API to the SEL Nexus backend (avoids CORS)
    location /api/automation-agents/ {
        proxy_pass https://mnnb9bbkgu.ap-south-1.awsapprunner.com/api/automation-agents/;
        proxy_set_header Host mnnb9bbkgu.ap-south-1.awsapprunner.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for AWS App Runner
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
